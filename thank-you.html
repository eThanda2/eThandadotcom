<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | eT Tech</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="index.css">
  <style>
    .thank-you-section {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: linear-gradient(135deg, var(--color-background) 0%, #1a1a2e 100%);
    }
    .thank-you-content {
      background: rgba(255, 255, 255, 0.03);
      padding: 4rem 3rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      max-width: 600px;
      width: 100%;
    }
    .success-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem auto;
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
    }
    .success-icon svg {
      width: 40px;
      height: 40px;
      color: white;
    }
    .thank-you-content h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 3rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .thank-you-content p {
      color: var(--color-text-light);
      font-size: 1.2rem;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }
    .btn-home {
      display: inline-block;
      padding: 1rem 2.5rem;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
    }
    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4);
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="main-nav">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <span class="logo-text">eT <span class="highlight">Tech</span></span>
      </a>
    </div>
  </nav>

  <!-- Thank You Section -->
  <section class="thank-you-section">
    <div class="thank-you-content">
      <div class="success-icon">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
        </svg>
      </div>
      <h1>Thank You!</h1>
      <p>We have successfully received your submission. Our team will review it and get back to you shortly.</p>
      <a href="index.html" class="btn-home">Return to Homepage</a>
    </div>
  </section>

</body>
</html>
